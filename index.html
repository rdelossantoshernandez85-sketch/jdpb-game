<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sky Combat - Pixel Edition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #f7f7f7;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; font-family: monospace; color: #535353;
    overflow: hidden; touch-action: none;
  }
  #wrap { position: relative; width: 100%; max-width: 820px; }
  canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #fff; border-bottom: 2px solid #535353;
    display: block; width: 100%; height: auto;
  }
  .overlay {
    position: absolute; inset: 0; background: rgba(255,255,255,.96);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 16px;
  }
  h1 { font-size: 26px; letter-spacing: 3px; }
  h2 { font-size: 18px; letter-spacing: 2px; }
  .btn {
    font-family: inherit; font-size: 15px; color: #535353; background: #fff;
    border: 3px solid #535353; padding: 12px 22px; cursor: pointer;
    min-width: 220px; box-shadow: 4px 4px 0 #c9c9c9;
  }
  .btn:active { transform: translate(3px,3px); box-shadow: none; }
  .fila { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .mini { font-size: 11px; color: #8a8a8a; max-width: 420px; line-height: 1.5; }
  .oculto { display: none !important; }
  .card {
    border: 2px solid #535353; padding: 8px; background: #fff;
    cursor: pointer; text-align: left; min-width: 140px;
  }
  .card.locked { opacity: .6; }
  .card.selected { background: #535353; color: #fff; }
  .card span { display: block; font-size: 10px; color: #666; }
  .card.selected span { color: #ccc; }
  #tactil { position: absolute; inset: 0; display: none; pointer-events: none; }
  .pad { position: absolute; bottom: 12px; display: flex; gap: 12px; pointer-events: auto; }
  .pad.izq { left: 12px; }
  .pad.der { right: 12px; }
  .tbtn {
    width: 62px; height: 62px; border: 3px solid #535353;
    background: rgba(255,255,255,.75); color: #535353; font-size: 22px;
    font-family: inherit; display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  .tbtn.activo { background: #535353; color: #fff; }
  #monedas { position: absolute; top: 8px; left: 10px; font-size: 14px; }
  #nitro-bar {
    position: absolute; bottom: 80px; left: 10px; width: 100px; height: 10px;
    background: #ddd; border: 2px solid #535353; overflow: hidden;
  }
  #nitro-fill { height: 100%; background: #ff9800; width: 0%; transition: width 0.1s; }
  #nitro-label {
    position: absolute; bottom: 92px; left: 10px; font-size: 10px; font-weight: bold;
  }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game" width="800" height="400"></canvas>
  <div id="monedas" class="oculto">TARJETAS: <span id="cards">0</span></div>
  <div id="nitro-label">NITRO</div>
  <div id="nitro-bar"><div id="nitro-fill"></div></div>

  <!-- MENÚ -->
  <div id="menu" class="overlay">
    <h1>SKY COMBAT</h1>
    <button class="btn" onclick="irJuego()">▶ JUGAR</button>
    <button class="btn" onclick="abrirTienda()">🃏 TIENDA</button>
    <p class="mini">↑/W subir · ↓/S bajar · X o CLICK disparar<br>Agarra tarjetas, nitro y escudos en el aire! (N para nitro)</p>
  </div>

  <!-- TIENDA -->
  <div id="tienda" class="overlay oculto">
    <h2>TUS TARJETAS: <span id="cardsShop">0</span></h2>
    <div style="font-size:13px;">AVIONES</div>
    <div class="fila" id="listaAviones"></div>
    <div style="font-size:13px;margin-top:6px;">ARMAS</div>
    <div class="fila" id="listaArmas"></div>
    <button class="btn" onclick="cerrarTienda()">VOLVER</button>
  </div>

  <!-- GAME OVER -->
  <div id="fin" class="overlay oculto">
    <h2>G A M E &nbsp; O V E R</h2>
    <p>PUNTOS: <span id="pts">0</span> · TARJETAS: <span id="ganadas">0</span></p>
    <button class="btn" onclick="irJuego()">JUGAR DE NUEVO</button>
    <button class="btn" onclick="irMenu()">MENÚ</button>
  </div>

  <!-- CONTROLES TÁCTILES -->
  <div id="tactil">
    <div class="pad izq">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div class="tbtn" data-k="up">▲</div>
        <div class="tbtn" data-k="down">▼</div>
      </div>
    </div>
    <div class="pad der"><div class="tbtn" data-k="fire">✸</div></div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const esTactil = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

const SUELO = 340;
const VEL_VERT = 4.8;

/* ---------- GUARDADO (Inicialización) ---------- */
// Cargar datos guardados o iniciar desde cero
let guardado = { tarjetas:0, avion:'caza', arma:'simple', aviones:['caza'], armas:['simple'] };
try { const g = localStorage.getItem('skycombat'); if (g) guardado = JSON.parse(g); } catch(e){}

// FUNCIÓN CRÍTICA: Reinicia a lo básico si el usuario quiere empezar de nuevo
// Pero por defecto, mantiene lo que tenga guardado.
// Si quieres FORZAR siempre que empiece con lo básico, descomenta la siguiente línea:
// if (confirm("¿Quieres reiniciar tu progreso y empezar con el avión básico?")) { guardado = { tarjetas:0, avion:'caza', arma:'simple', aviones:['caza'], armas:['simple'] }; guardar(); }

function guardar(){ try{ localStorage.setItem('skycombat', JSON.stringify(guardado)); }catch(e){} }

/* ---------- ITEMS ---------- */
const AVIONES = {
  caza:    { nombre:'CAZA',      precio:0,  desc:'Equilibrado' },
  cazon:   { nombre:'CAZA NOCT', precio:15, desc:'Más ágil' },
  bomba:   { nombre:'BOMBARDEO', precio:30, desc:'Dispara doble' },
  stealth: { nombre:'STEALTH',   precio:60, desc:'Escudo al iniciar' }
};
const ARMAS = {
  simple: { nombre:'RÁFAGA',    precio:0,  cadencia:14, balas:1, vel:13 },
  rapida: { nombre:'AMETRALL.', precio:12, cadencia:7,  balas:1, vel:15 },
  doble:  { nombre:'DOBLE',     precio:25, cadencia:12, balas:2, vel:13 },
  laser:  { nombre:'LÁSER',     precio:50, cadencia:8,  balas:1, vel:28, ancho:6 }
};

/* ---------- ESTADO DEL JUEGO ---------- */
let jugador, misiles, balas, enemigos, edificios, puntos, velocidad;
let juegoActivo=false, gameover=false, frame=0, escudo=0, enfriamiento=0, ganadas=0;
let nitro=0, nitroMax=100, nitroActive=false, nitroTimer=0;
let items = [];

function iniciar() {
  // Asegurarse de que el jugador tenga al menos el avión y arma básicos
  if (!guardado.aviones.includes(guardado.avion)) guardado.avion = 'caza';
  if (!guardado.armas.includes(guardado.arma)) guardado.arma = 'simple';

  const a = guardado.avion;
  jugador = { x:60, y:180, ancho:48, alto:26, arriba:false, abajo:false, tipo:a };
  jugador.velVert = (a === 'cazon') ? VEL_VERT + 1.2 : VEL_VERT;
  escudo = (a === 'stealth') ? 120 : 0;
  nitro = 0;
  nitroActive = false;
  nitroTimer = 0;

  misiles=[]; balas=[]; enemigos=[]; edificios=[]; items=[];
  puntos=0; velocidad=6; juegoActivo=true; gameover=false;
  frame=0; ganadas=0; enfriamiento=0;
  actualizarMonedas();
}

/* ---------- CONTROLES ---------- */
document.addEventListener('keydown', e => {
  if (!juegoActivo) return;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') { jugador.arriba = true; e.preventDefault(); }
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { jugador.abajo = true; e.preventDefault(); }
  if (e.code === 'KeyX') disparar();
  if (e.code === 'KeyN') usarNitro();
});
document.addEventListener('keyup', e => {
  if (!jugador) return;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') jugador.arriba = false;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') jugador.abajo = false;
});
canvas.addEventListener('mousedown', () => { if (juegoActivo) disparar(); });

if (esTactil) document.getElementById('tactil').style.display = 'block';
document.querySelectorAll('.tbtn').forEach(b => {
  const k = b.dataset.k;
  const on = ev => {
    ev.preventDefault(); b.classList.add('activo');
    if (!jugador) return;
    if (k === 'up') jugador.arriba = true;
    if (k === 'down') jugador.abajo = true;
    if (k === 'fire') disparar();
  };
  const off = ev => {
    ev.preventDefault(); b.classList.remove('activo');
    if (!jugador) return;
    if (k === 'up') jugador.arriba = false;
    if (k === 'down') jugador.abajo = false;
  };
  b.addEventListener('touchstart', on, {passive: false});
  b.addEventListener('touchend', off, {passive: false});
  b.addEventListener('mousedown', on);
  b.addEventListener('mouseup', off);
  b.addEventListener('mouseleave', off);
});

/* ---------- FUNCIONES DE JUEGO ---------- */
function usarNitro() {
  if (!juegoActivo || nitro <= 0 || nitroActive) return;
  nitroActive = true;
  nitroTimer = 120;
}

function disparar() {
  if (!juegoActivo || enfriamiento > 0) return;
  const arma = ARMAS[guardado.arma];
  let n = arma.balas;
  if (jugador.tipo === 'bomba') n = Math.max(n, 2);
  
  const cadencia = nitroActive ? Math.max(1, arma.cadencia - 5) : arma.cadencia;
  if (enfriamiento <= 0) {
    enfriamiento = cadencia;
  }

  for (let i = 0; i < n; i++) {
    let vel = arma.vel;
    if (nitroActive) vel *= 1.5;
    let ancho = arma.ancho || 12;
    if (nitroActive && arma.nombre === 'LÁSER') ancho = 10;
    
    balas.push({ 
      x: jugador.x + jugador.ancho, 
      y: jugador.y + 11 + (i === 1 ? 10 : 0), 
      ancho: ancho, 
      alto: 4, 
      vel: vel,
      tipo: arma.nombre === 'LÁSER' ? 'laser' : 'normal'
    });
  }
}

function crearElementos() {
  if (frame % Math.max(38, 75 - Math.floor(puntos / 8)) === 0)
    misiles.push({ x: canvas.width, y: SUELO - 40, ancho: 20, alto: 40 });

  if (frame % Math.max(55, 105 - Math.floor(puntos / 4)) === 0) {
    const altura = 120 + Math.random() * 150;
    const isDañado = Math.random() > 0.7;
    edificios.push({ x: canvas.width, y: SUELO - altura, ancho: 34, alto: altura, hp: isDañado ? 2 : 5, isDañado: isDañado });
  }

  if (frame % Math.max(45, 95 - Math.floor(puntos / 6)) === 0)
    enemigos.push({ x: canvas.width, y: 20 + Math.random() * 120, ancho:46, alto:22, alas:0, vel:velocidad + 2 });

  if (frame % Math.max(60, 110 - Math.floor(puntos / 6)) === 0)
    enemigos.push({ x: canvas.width, y: 160 + Math.random() * 140, ancho:46, alto:22, alas:0, vel:velocidad + 1 });

  if (frame % 180 === 0) {
    const tipo = Math.random();
    let itemX = canvas.width;
    let itemY = 50 + Math.random() * (SUELO - 60);
    
    if (tipo < 0.5) {
      items.push({ x: itemX, y: itemY, tipo: 'card', ancho: 16, alto: 24, anim: 0 });
    } else if (tipo < 0.8) {
      items.push({ x: itemX, y: itemY, tipo: 'nitro', ancho: 20, alto: 16, anim: 0 });
    } else {
      if (frame % 300 === 0) {
        items.push({ x: itemX, y: itemY, tipo: 'shield', ancho: 24, alto: 24, anim: 0 });
      }
    }
  }
}

function dibujarJugador() {
  const px = Math.round(jugador.x), py = Math.round(jugador.y);
  const col = escudo > 0 ? '#9e9e9e' : (nitroActive ? '#ff9800' : '#535353');
  ctx.fillStyle = col;
  ctx.fillRect(px + 6, py + 10, 32, 8);
  ctx.beginPath(); ctx.moveTo(px + 38, py + 10); ctx.lineTo(px + 46, py + 14); ctx.lineTo(px + 38, py + 18); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(px + 26, py + 6, 8, 5);
  ctx.fillStyle = col; ctx.fillRect(px + 24, py + 6, 12, 4);
  ctx.beginPath(); ctx.moveTo(px + 14, py + 14); ctx.lineTo(px + 30, py + 14); ctx.lineTo(px + 22, py + 26); ctx.lineTo(px + 12, py + 26); ctx.fill();
  ctx.beginPath(); ctx.moveTo(px + 16, py + 10); ctx.lineTo(px + 28, py + 10); ctx.lineTo(px + 22, py + 2); ctx.lineTo(px + 14, py + 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(px + 6, py + 10); ctx.lineTo(px + 12, py + 10); ctx.lineTo(px + 8, py); ctx.lineTo(px + 2, py); ctx.fill();
  ctx.fillRect(px, py + 12, 8, 4);

  if (nitroActive) {
    ctx.fillStyle = '#ff9800';
    ctx.fillRect(px - 8, py + 11, 8, 6);
    ctx.fillStyle = '#ffeb3b';
    ctx.fillRect(px - 4, py + 12, 4, 4);
  }

  if (jugador.tipo === 'bomba') { ctx.fillRect(px + 30, py + 20, 6, 4); ctx.fillRect(px + 20, py + 20, 6, 4); }
  if (jugador.tipo === 'stealth') { ctx.fillStyle = '#fff'; ctx.fillRect(px + 10, py + 12, 20, 2); }
}

function dibujarEnemigo(e) {
  const px = Math.round(e.x), py = Math.round(e.y); ctx.fillStyle = '#535353';
  ctx.fillRect(px + 10, py + 8, 26, 6); ctx.fillRect(px + 36, py + 6, 8, 8); ctx.fillRect(px + 44, py + 8, 4, 4);
  if (e.alas < 15) ctx.fillRect(px + 16, py, 14, 8); else ctx.fillRect(px + 16, py + 14, 14, 8);
  e.alas++; if (e.alas > 30) e.alas = 0;
}

function dibujarMisil(m) {
  const px = Math.round(m.x), py = Math.round(m.y); ctx.fillStyle = '#535353';
  ctx.fillRect(px + 6, py, 8, m.alto); ctx.fillRect(px + 4, py - 4, 12, 4);
  ctx.fillRect(px, py + m.alto - 10, 6, 10); ctx.fillRect(px + 14, py + m.alto - 10, 6, 10);
}

function dibujarEdificio(b) {
  const px = Math.round(b.x), py = Math.round(b.y);
  ctx.fillStyle = '#535353';
  
  if (b.isDañado) {
    ctx.fillRect(px, py + 20, b.ancho, b.alto - 20);
    ctx.fillRect(px + 4, py + 10, 10, 10);
    ctx.fillRect(px + 18, py + 14, 8, 6);
  } else {
    ctx.fillRect(px, py, b.ancho, b.alto);
  }

  ctx.fillStyle = '#fff';
  for (let i = py + 8; i < py + b.alto - 8; i += 16) {
    for (let j = px + 6; j < px + b.ancho - 6; j += 12) {
      ctx.fillRect(j, i, 6, 8);
    }
  }

  if (b.hp <= 2 && frame % 6 < 3) {
    ctx.fillStyle = '#535353';
    const fx = px + Math.floor(Math.random() * b.ancho);
    ctx.fillRect(fx, py - 6, 4, 6);
    ctx.fillRect(fx + 6, py - 10, 4, 10);
    ctx.fillRect(px + b.ancho / 2, py - 16, 6, 6);
  }
}

function dibujarItem(it) {
  const px = Math.round(it.x), py = Math.round(it.y);
  it.anim++;
  const flotar = Math.sin(it.anim * 0.1) * 4;
  const fy = py + flotar;

  if (it.tipo === 'card') {
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#535353';
    ctx.lineWidth = 2;
    ctx.fillRect(px, fy, it.ancho, it.alto);
    ctx.strokeRect(px, fy, it.ancho, it.alto);
    ctx.fillStyle = '#535353';
    ctx.fillRect(px + 4, fy + 6, 8, 2);
    ctx.fillRect(px + 4, fy + 12, 8, 2);
    ctx.fillRect(px + 7, fy + 4, 2, 16);
  } 
  else if (it.tipo === 'nitro') {
    ctx.fillStyle = '#535353';
    ctx.fillRect(px + 4, fy, 12, 16);
    ctx.fillStyle = '#fff';
    ctx.fillRect(px + 6, fy + 3, 8, 10);
    ctx.fillStyle = '#535353';
    ctx.font = 'bold 10px monospace';
    ctx.fillText('N', px + 8, fy + 12);
  } 
  else if (it.tipo === 'shield') {
    ctx.fillStyle = '#535353';
    ctx.fillRect(px + 4, fy, 16, 4);
    ctx.fillRect(px + 2, fy + 4, 20, 12);
    ctx.fillRect(px + 6, fy + 16, 12, 4);
    ctx.fillRect(px + 10, fy + 20, 4, 4);
    ctx.fillStyle = '#fff';
    ctx.fillRect(px + 10, fy + 6, 4, 12);
    ctx.fillRect(px + 6, fy + 10, 12, 4);
  }
}

function colision(a, b) {
  const m = 4;
  return a.x + m < b.x + b.ancho && a.x + a.ancho - m > b.x && a.y + m < b.y + b.alto && a.y + a.alto - m > b.y;
}

function explosion(x, y) {
  ctx.fillStyle = '#535353';
  [[-10, -10], [6, -8], [-8, 6], [8, 4], [-2, -2]].forEach(([dx, dy]) => ctx.fillRect(x + dx, y + dy, 4, 4));
}

/* ================= BUCLE PRINCIPAL ================= */
function loop() {
  if (!juegoActivo) return;
  frame++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#535353';
  for (let i = -(frame * velocidad % 20); i < canvas.width; i += 20) ctx.fillRect(i, SUELO, 12, 2);

  if (nitroActive) {
    nitroTimer--;
    nitro = Math.max(0, nitro - 0.8);
    if (nitroTimer <= 0 || nitro <= 0) nitroActive = false;
  }
  document.getElementById('nitro-fill').style.width = nitro + '%';

  if (escudo > 0) escudo--;
  if (enfriamiento > 0) enfriamiento--;

  const multVel = nitroActive ? 1.6 : 1;
  if (jugador.arriba) jugador.y -= jugador.velVert;
  if (jugador.abajo) jugador.y += jugador.velVert;
  if (jugador.y < 5) jugador.y = 5;
  if (jugador.y > SUELO - jugador.alto) jugador.y = SUELO - jugador.alto;

  dibujarJugador();
  crearElementos();

  balas.forEach((b, i) => {
    b.x += b.vel * multVel;
    if (b.tipo === 'laser') {
      ctx.fillStyle = '#535353';
      ctx.fillRect(b.x, b.y, b.ancho, 2);
      ctx.fillRect(b.x + b.ancho, b.y - 1, 4, 4);
    } else {
      ctx.fillStyle = '#535353';
      ctx.fillRect(b.x, b.y, b.ancho, b.alto);
    }
    if (b.x > canvas.width) balas.splice(i, 1);
  });

  items.forEach((it, i) => {
    it.x -= velocidad;
    dibujarItem(it);
    if (colision(jugador, it)) {
      if (it.tipo === 'card') { guardado.tarjetas++; ganadas++; puntos += 5; }
      if (it.tipo === 'nitro') { nitro = Math.min(nitroMax, nitro + 40); }
      if (it.tipo === 'shield') { escudo = 300; }
      actualizarMonedas();
      explosion(it.x + 8, it.y + 8);
      items.splice(i, 1);
    }
    if (it.x < -30) items.splice(i, 1);
  });

  misiles.forEach((m, i) => {
    m.x -= velocidad;
    dibujarMisil(m);
    if (colision(jugador, m)) morir();
    if (m.x < -30) { misiles.splice(i, 1); puntos += 1; }
  });

  enemigos.forEach((e, i) => {
    e.x -= e.vel || velocidad + 1;
    dibujarEnemigo(e);
    if (colision(jugador, e)) morir();
    balas.forEach((b, bi) => {
      if (colision(b, e)) {
        explosion(e.x + 23, e.y + 11);
        enemigos.splice(i, 1);
        balas.splice(bi, 1);
        puntos += 10;
      }
    });
    if (e.x < -50) enemigos.splice(i, 1);
  });

  edificios.forEach((b, i) => {
    b.x -= velocidad;
    dibujarEdificio(b);
    if (colision(jugador, b)) morir();
    balas.forEach((bl, bi) => {
      if (colision(bl, b)) {
        b.hp--;
        balas.splice(bi, 1);
        explosion(b.x + b.ancho / 2, bl.y);
        if (b.hp <= 0) {
          explosion(b.x + b.ancho / 2, b.y + 20);
          edificios.splice(i, 1);
          puntos += 25;
        }
      }
    });
    if (b.x < -40) edificios.splice(i, 1);
  });

  velocidad = 6 + puntos / 200;
  const velRender = nitroActive ? velocidad * 1.8 : velocidad;

  ctx.fillStyle = '#535353';
  ctx.font = 'bold 20px monospace';
  ctx.fillText(String(puntos).padStart(5, '0'), canvas.width - 100, 30);
  if (guardado.tarjetas > 0) {
    ctx.fillText('HI ' + String(guardado.tarjetas).padStart(5, '0'), canvas.width - 220, 30);
  }

  requestAnimationFrame(loop);
}

function morir() {
  explosion(jugador.x + 20, jugador.y + 12);
  juegoActivo = false;
  gameover = true;
  jugador.arriba = false;
  jugador.abajo = false;
  const bonus = Math.max(1, Math.floor(puntos / 100)) + ganadas;
  guardado.tarjetas += bonus;
  guardar();
  actualizarMonedas();
  document.getElementById('pts').textContent = puntos;
  document.getElementById('ganadas').textContent = bonus;
  document.getElementById('fin').classList.remove('oculto');
}

/* ================= TIENDA Y MENÚ ================= */
function actualizarMonedas() {
  document.getElementById('cards').textContent = guardado.tarjetas;
  document.getElementById('cardsShop').textContent = guardado.tarjetas;
}

function irJuego() {
  document.getElementById('menu').classList.add('oculto');
  document.getElementById('tienda').classList.add('oculto');
  document.getElementById('fin').classList.add('oculto');
  iniciar();
  loop();
}

function irMenu() {
  document.getElementById('menu').classList.remove('oculto');
  document.getElementById('tienda').classList.add('oculto');
  document.getElementById('fin').classList.add('oculto');
}

function abrirTienda() {
  document.getElementById('menu').classList.add('oculto');
  document.getElementById('tienda').classList.remove('oculto');
  actualizarMonedas();
  renderizarTienda();
}

function cerrarTienda() {
  document.getElementById('tienda').classList.add('oculto');
  document.getElementById('menu').classList.remove('oculto');
  actualizarMonedas();
}

function renderizarTienda() {
  const listaAviones = document.getElementById('listaAviones');
  const listaArmas = document.getElementById('listaArmas');
  listaAviones.innerHTML = '';
  listaArmas.innerHTML = '';

  Object.keys(AVIONES).forEach(key => {
    const item = AVIONES[key];
    const btn = document.createElement('div');
    btn.className = 'card';
    if (guardado.aviones.includes(key)) {
      if (guardado.avion === key) btn.classList.add('selected');
    } else {
      btn.classList.add('locked');
    }
    btn.innerHTML = `<strong>${item.nombre}</strong><span>${item.desc}</span><span>Precio: ${item.precio}</span>`;
    btn.onclick = () => comprarOrSeleccionar('avion', key, item);
    listaAviones.appendChild(btn);
  });

  Object.keys(ARMAS).forEach(key => {
    const item = ARMAS[key];
    const btn = document.createElement('div');
    btn.className = 'card';
    if (guardado.armas.includes(key)) {
      if (guardado.arma === key) btn.classList.add('selected');
    } else {
      btn.classList.add('locked');
    }
    btn.innerHTML = `<strong>${item.nombre}</strong><span>${item.desc || 'Cadencia: ' + item.cadencia}</span><span>Precio: ${item.precio}</span>`;
    btn.onclick = () => comprarOrSeleccionar('arma', key, item);
    listaArmas.appendChild(btn);
  });
}

function comprarOrSeleccionar(tipo, key, item) {
  const lista = guardado[tipo + 's'];
  const actual = guardado[tipo];
  const tiene = lista.includes(key);

  if (tiene && actual !== key) {
    guardado[tipo] = key;
    guardar();
    renderizarTienda();
    actualizarMonedas();
  } else if (!tiene && guardado.tarjetas >= item.precio) {
    guardado.tarjetas -= item.precio;
    lista.push(key);
    if (tipo === 'avion') guardado.avion = key;
    else guardado.arma = key;
    guardar();
    renderizarTienda();
    actualizarMonedas();
  } else if (!tiene) {
    alert('No tienes suficientes tarjetas para desbloquear esto.');
  }
}

document.getElementById('menu').classList.remove('oculto');
document.getElementById('tienda').classList.add('oculto');
document.getElementById('fin').classList.add('oculto');
actualizarMonedas();
</script>
